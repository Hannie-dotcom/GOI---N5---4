<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Minna no Nihongo - Bài 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Cánh hoa anh đào rơi */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 28px;
            padding: 32px 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b06d7e; margin-bottom: 20px; }

        /* Flashcard Lật 3D */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 230px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.12);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #f2d5db;
            background: #ffffff;
            padding: 16px;
        }
        .card-front { color: #3a2e30; }
        .card-back {
            background: #fff8f9;
            color: #d85a7f;
            transform: rotateY(180deg);
        }

        .kanji-text { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
        .hint-text { font-size: 12px; color: #b06d7e; margin-top: 10px; opacity: 0.8; }
        
        .hiragana-text { font-size: 22px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .meaning-text { font-size: 18px; font-weight: 700; color: #4a383b; margin-bottom: 10px; }
        
        /* Khung câu ví dụ */
        .example-box {
            background: rgba(216, 90, 127, 0.08);
            border-left: 3px solid #d85a7f;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #5a4046;
            text-align: left;
            width: 100%;
        }
        .example-jp { font-weight: 600; color: #3a2e30; }
        .example-vi { font-size: 12px; color: #7a5c63; }

        /* Danh sách 4 lựa chọn tiếng Việt */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { background: #fff5f7; border-color: #d85a7f; transform: translateY(-1px); }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .opt-btn:disabled { cursor: default; }

        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1; padding: 12px; border: none; background: #f2d5db; color: #8c5665;
            font-weight: 600; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: #d85a7f; color: white; }

        /* Màn hình Chúc mừng khi hoàn thành */
        .congrats-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }
        .congrats-icon { font-size: 60px; margin-bottom: 12px; }
        .congrats-title { font-size: 24px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .congrats-desc { font-size: 15px; color: #5a4046; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn {
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px 32px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(216, 90, 127, 0.3);
        }
        .restart-btn:hover { opacity: 0.95; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Khung học Flashcard chính -->
        <div id="learning-section">
            <div class="header">
                <span id="lesson-title">Minna no Nihongo - Bài 4</span>
                <span id="card-count">1 / 32</span>
            </div>

            <!-- Flashcard lật 3D -->
            <div class="flashcard-wrapper" onclick="toggleFlip()">
                <div class="flashcard" id="card">
                    <div class="card-front">
                        <div class="kanji-text" id="kanji-display">起きます</div>
                        <div class="hint-text">💡 Chạm vào đây để lật xem cách đọc & ví dụ</div>
                    </div>
                    <div class="card-back">
                        <div class="hiragana-text" id="hiragana-display">おきます</div>
                        <div class="meaning-text" id="meaning-display">Dậy / Thức dậy</div>
                        <div class="example-box">
                            <div class="example-jp" id="example-jp">わたしは 毎朝 6時に 起きます。</div>
                            <div class="example-vi" id="example-vi">Mỗi sáng tôi thức dậy vào lúc 6 giờ.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4 Lựa chọn trắc nghiệm tiếng Việt -->
            <div class="options-grid" id="options-box">
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
            </div>

            <!-- Điều hướng -->
            <div class="controls">
                <button class="nav-btn" onclick="prevCard()">← Thẻ trước</button>
                <button class="nav-btn" onclick="nextCard()">Thẻ tiếp →</button>
            </div>
        </div>

        <!-- Màn hình Chúc mừng sau khi hoàn thành -->
        <div class="congrats-card" id="congrats-section">
            <div class="congrats-icon">🌸🎉</div>
            <div class="congrats-title">おめでとうございます!</div>
            <div class="congrats-desc">
                Chúc mừng bạn đã hoàn thành trọn bộ <strong>32 từ vựng Bài 4</strong>!<br>
                Điểm số trả lời đúng: <strong id="score-text" style="color:#d85a7f;">0/32</strong>
            </div>
            <button class="restart-btn" onclick="restartLesson()">🔄 Học lại Bài 4</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Danh sách từ vựng Bài 4 trích xuất chính xác từ sách Minna no Nihongo I
        const vocabList = [
            { kanji: '起きます', hiragana: 'おきます', meaning: 'Dậy / Thức dậy', exJp: 'わたしは 毎朝 6時に 起きます。', exVi: 'Mỗi sáng tôi thức dậy vào lúc 6 giờ.' },
            { kanji: '寝ます', hiragana: 'ねます', meaning: 'Ngủ / Đi ngủ', exJp: '毎晩 11時に 寝ます。', exVi: 'Hàng tối tôi đi ngủ lúc 11 giờ.' },
            { kanji: '働きます', hiragana: 'はたらきます', meaning: 'Làm việc', exJp: '9時から 5時まで 働きます。', exVi: 'Tôi làm việc từ 9 giờ đến 5 giờ.' },
            { kanji: '休みます', hiragana: 'やすみます', meaning: 'Nghỉ / Nghỉ ngơi', exJp: '土曜日は 休みます。', exVi: 'Thứ bảy tôi nghỉ.' },
            { kanji: '勉強します', hiragana: 'べんきょうします', meaning: 'Học', exJp: 'わたしは きのう 勉強しました。', exVi: 'Tôi đã học ngày hôm qua.' },
            { kanji: '終わります', hiragana: 'おわります', meaning: 'Hết / Kết thúc / Xong', exJp: '会議は 12時に 終わります。', exVi: 'Cuộc họp kết thúc lúc 12 giờ.' },
            { kanji: '銀行', hiragana: 'ぎんこう', meaning: 'Ngân hàng', exJp: '銀行は 9時から 3時までです。', exVi: 'Ngân hàng mở cửa từ 9 giờ đến 3 giờ.' },
            { kanji: '郵便局', hiragana: 'ゆうびんきょく', meaning: 'Bưu điện', exJp: '郵便局は どこですか。', exVi: 'Bưu điện ở đâu?' },
            { kanji: '図書館', hiragana: 'としょかん', meaning: 'Thư viện', exJp: '図書館は 9時に 終わります。', exVi: 'Thư viện đóng cửa lúc 9 giờ.' },
            { kanji: '美術館', hiragana: 'びじゅつかん', meaning: 'Bảo tàng mỹ thuật', exJp: 'やまと美術館は 休みに です。', exVi: 'Bảo tàng mỹ thuật Yamato nghỉ.' },
            { kanji: '今', hiragana: 'いま', meaning: 'Bây giờ', exJp: '今 何時ですか。', exVi: 'Bây giờ là mấy giờ?' },
            { kanji: '～時', hiragana: '～じ', meaning: '～ giờ', exJp: '今 4時です。', exVi: 'Bây giờ là 4 giờ.' },
            { kanji: '～分', hiragana: '～ふん / ぷん', meaning: '～ phút', exJp: '今 4時 5分です。', exVi: 'Bây giờ là 4 giờ 5 phút.' },
            { kanji: '半', hiragana: 'はん', meaning: 'Rưỡi / Nửa', exJp: '7時半に 起きます。', exVi: 'Tôi thức dậy lúc 7 giờ rưỡi.' },
            { kanji: '何時', hiragana: 'なんじ', meaning: 'Mấy giờ', exJp: '毎晩 何時に 寝ますか。', exVi: 'Hàng tối bạn đi ngủ lúc mấy giờ?' },
            { kanji: '何分', hiragana: 'なんぷん', meaning: 'Mấy phút', exJp: '今 何時 何分ですか。', exVi: 'Bây giờ là mấy giờ mấy phút?' },
            { kanji: '午前', hiragana: 'ごぜん', meaning: 'Sáng / Trước 12 giờ trưa', exJp: '午前 9時から 働きます。', exVi: 'Tôi làm việc từ 9 giờ sáng.' },
            { kanji: '午後', hiragana: 'ごご', meaning: 'Chiều / Sau 12 giờ trưa', exJp: '午後 3時まで 勉強します。', exVi: 'Tôi học đến 3 giờ chiều.' },
            { kanji: '朝', hiragana: 'あさ', meaning: 'Buổi sáng / Sáng', exJp: '毎朝 6時に 起きます。', exVi: 'Mỗi sáng tôi dậy lúc 6 giờ.' },
            { kanji: '昼', hiragana: 'ひる', meaning: 'Buổi trưa / Trưa', exJp: '昼 12時から 休みます。', exVi: 'Buổi trưa nghỉ từ 12 giờ.' },
            { kanji: '晩［夜］', hiragana: 'ばん［よる］', meaning: 'Buổi tối / Tối', exJp: '今晩 勉強します。', exVi: 'Tối nay tôi học.' },
            { kanji: 'おととい', hiragana: 'おととい', meaning: 'Hôm kia', exJp: 'おととい 勉強しました。', exVi: 'Hôm kia tôi đã học.' },
            { kanji: 'きのう', hiragana: 'きのう', meaning: 'Hôm qua', exJp: 'きのう 働きました。', exVi: 'Hôm qua tôi đã làm việc.' },
            { kanji: 'きょう', hiragana: 'きょう', meaning: 'Hôm nay', exJp: 'きょうは 何曜日ですか。', exVi: 'Hôm nay là thứ mấy?' },
            { kanji: 'あした', hiragana: 'あした', meaning: 'Ngày mai', exJp: 'あした 働きますか。', exVi: 'Ngày mai bạn có làm việc không?' },
            { kanji: 'あさって', hiragana: 'あさって', meaning: 'Ngày kia', exJp: 'あさっては 日曜日です。', exVi: 'Ngày kia là chủ nhật.' },
            { kanji: 'けさ', hiragana: 'けさ', meaning: 'Sáng nay', exJp: 'けさ 6時に 起きました。', exVi: 'Sáng nay tôi đã dậy lúc 6 giờ.' },
            { kanji: '今晩', hiragana: 'こんばん', meaning: 'Tối nay', exJp: '今晩 何時に 寝ますか。', exVi: 'Tối nay bạn đi ngủ lúc mấy giờ?' },
            { kanji: '休み', hiragana: 'やすみ', meaning: 'Nghỉ / Ngày nghỉ', exJp: '休みは 何曜日ですか。', exVi: 'Ngày nghỉ là thứ mấy?' },
            { kanji: '昼休み', hiragana: 'ひるやすみ', meaning: 'Nghỉ trưa', exJp: '昼休みは 12時から 1時までです。', exVi: 'Nghỉ trưa từ 12 giờ đến 1 giờ.' },
            { kanji: '試験', hiragana: 'しけん', meaning: 'Kỳ thi / Bài kiểm tra', exJp: '試験は 10時からです。', exVi: 'Bài kiểm tra bắt đầu từ 10 giờ.' },
            { kanji: '会議', hiragana: 'かいぎ', meaning: 'Cuộc họp / Hội nghị', exJp: '会議は 何時に 終わりますか。', exVi: 'Cuộc họp kết thúc lúc mấy giờ?' }
        ];

        const extraDistractors = [
            "Tập thể dục", "Ăn sáng", "Uống cà phê", "Nấu ăn", "Đọc sách",
            "Trường học", "Cửa hàng tiện lợi", "Bệnh viện", "Công ty", "Siêu thị"
        ];

        let currentIndex = 0;
        let answeredCurrent = false;
        let correctCount = 0;

        function updateCard() {
            const current = vocabList[currentIndex];
            document.getElementById('card-count').innerText = `${currentIndex + 1} / ${vocabList.length}`;
            document.getElementById('kanji-display').innerText = current.kanji;
            document.getElementById('hiragana-display').innerText = current.hiragana;
            document.getElementById('meaning-display').innerText = current.meaning;
            document.getElementById('example-jp').innerText = current.exJp;
            document.getElementById('example-vi').innerText = current.exVi;
            
            document.getElementById('card').classList.remove('flipped');
            answeredCurrent = false;

            let options = [current.meaning];
            vocabList.forEach(item => {
                if (!options.includes(item.meaning) && options.length < 4) {
                    options.push(item.meaning);
                }
            });

            let distractorIndex = 0;
            while (options.length < 4 && distractorIndex < extraDistractors.length) {
                let text = extraDistractors[distractorIndex];
                if (!options.includes(text)) {
                    options.push(text);
                }
                distractorIndex++;
            }

            options.sort(() => Math.random() - 0.5);

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = options[i];
                btn.className = 'opt-btn';
                btn.disabled = false;
            });
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function checkAnswer(btn) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            document.getElementById('card').classList.add('flipped');

            if(btn.innerText === vocabList[currentIndex].meaning) {
                btn.classList.add('correct');
                correctCount++;
            } else {
                btn.classList.add('wrong');
            }

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);
        }

        function nextCard() {
            if (currentIndex === vocabList.length - 1) {
                showCongrats();
                return;
            }
            currentIndex++;
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function showCongrats() {
            document.getElementById('learning-section').style.display = 'none';
            document.getElementById('congrats-section').style.display = 'flex';
            document.getElementById('score-text').innerText = `${correctCount} / ${vocabList.length}`;
        }

        function restartLesson() {
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('congrats-section').style.display = 'none';
            document.getElementById('learning-section').style.display = 'block';
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
